name: Daily pipeline

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    # Backfill knobs for a manual run (the scheduled run leaves them empty and keeps the defaults: 10, 5, 3).
    inputs:
      analyze_minutes:
        description: "AI analysis budget in minutes (1-30, default 10)"
        required: false
        default: ""
      analyze_listed_minutes:
        description: "Catch-up analysis budget for newly listed projects in minutes (1-30, default 5)"
        required: false
        default: ""
      analyze_concurrency:
        description: "AI analyses at once (1-8, default 3)"
        required: false
        default: ""

permissions:
  contents: read

# Never run two pipelines at once: concurrent runs would race on project merges.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Hard limit. The pipeline stops starting LLM calls after its 35-minute extraction budget
    # (extractBudgetMinutes; each call is cut off after 180 s), merges each document as soon as it is
    # extracted, and leaves the rest pending, so score and purge finish well within this limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Install without secrets in the environment (dependency install scripts never see them).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pipeline
        env:
          # freellm (first model, `auto`). LLM_API_KEY may be empty (no Authorization header is sent);
          # an empty LLM_BASE_URL falls back to https://freellm.hellvyn.id/v1.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          # NVIDIA (fallback models).
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Anthropic Claude Sonnet, first model of the AI analyses only (prepaid credit, expires 2026-10-27).
          # Empty or unset: the analyses skip Claude and use the chain above. Any Claude failure falls back too.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYZE_BUDGET_MINUTES: ${{ inputs.analyze_minutes }}
          ANALYZE_LISTED_BUDGET_MINUTES: ${{ inputs.analyze_listed_minutes }}
          ANALYZE_CONCURRENCY: ${{ inputs.analyze_concurrency }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --silent --filter pipeline start
