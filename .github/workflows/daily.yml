name: Daily pipeline

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never run two pipelines at once: concurrent runs would race on project merges.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Hard limit. The pipeline stops starting LLM calls after its 35-minute extraction budget
    # (extractBudgetMinutes; each call is cut off after 180 s), merges each document as soon as it is
    # extracted, and leaves the rest pending, so score and purge finish well within this limit.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Install without secrets in the environment (dependency install scripts never see them).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Email digest: off while BREVO_API_KEY is empty; with it, EMAIL_FROM and SITE_URL are required.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: pnpm --silent --filter pipeline start
