name: CI

# Push only: a pull request's checks are the push run on its head commit, so a branch with an open PR runs once, not twice.
# Docs-only commits skip CI.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The slow job (local Supabase, pgTAP, Playwright) is off by default to save Actions minutes (owner 2026-10-12): it runs
  # only on a manual dispatch of this workflow. Typecheck and unit tests run on every push.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: >-
          npx -y supabase@2.120.0 start
          -x studio,imgproxy,mailpit,vector,logflare,edge-runtime,realtime,storage-api,postgres-meta,supavisor
      - name: Database tests (pgTAP)
        run: npx -y supabase@2.120.0 test db
      - name: Export the web app's Supabase env
        # Only the URL, anon key and site URL go to the job env (the web build and server). The e2e harness reads the local
        # service role key itself from `supabase status` (apps/web/e2e/support/supabase-env.ts).
        run: |
          eval "$(npx -y supabase@2.120.0 status -o env 2>/dev/null)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - name: Coach quota concurrency test (needs the local stack)
        run: pnpm --filter web exec vitest run test/coach-quota.int.test.ts
        env:
          REQUIRE_LOCAL_STACK: "1"
      - run: pnpm --filter web build
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
