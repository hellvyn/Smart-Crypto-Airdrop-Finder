<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Daftar airdrop · AirdropIQ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F7F2}
a{color:#111111}a:hover{color:#C2410C}
.hazard{background:repeating-linear-gradient(-45deg,#111111 0 10px,#FF5A1F 10px 20px)}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;font-family:'Barlow',system-ui,sans-serif;color:#111111;background:#F7F7F2;display:flex;flex-direction:column">
<div class="hazard" style="height:8px;flex:none"></div>
<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:3px solid #111111">
<span style="display:flex;align-items:center;gap:8px">
<span style="width:28px;height:28px;border:3px solid #111111;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px">IQ</span>
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;text-transform:uppercase">AirdropIQ</span>
</span>
<a href="#" style="font-size:13px;font-weight:700;background:#111111;color:#F7F7F2;padding:10px 14px;text-transform:uppercase;text-decoration:none">Login</a>
</header>
<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;text-transform:uppercase;line-height:1">Update hari ini</span>
<span style="font-size:12px;font-weight:700"><span style="color:#1F7A45">[M]</span> / [N]</span>
</div>
<div style="display:flex;gap:6px;padding:4px 16px 12px;overflow-x:auto;flex:none">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
<div style="flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<a href="CProject.dc.html" style="display:flex;flex-direction:column;gap:10px;text-decoration:none;background:#FFFFFF;border:2px solid #111111;padding:14px">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;text-transform:uppercase;line-height:1">{{r.name}}</span>
<span style="font-size:13px;color:#2B2B28">{{r.meta}} · Risiko <b>{{r.risk}}</b></span>
</div>
<div style="{{r.stampStyle}}"><span style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:14px;line-height:1">{{r.stampTop}}</span><span style="font-size:9px;font-weight:700">{{r.stampBottom}}</span></div>
</div>
<span style="{{r.signalStyle}}">{{r.signal}}</span>
<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:2px dashed #111111;padding-top:10px">
<b>{{r.deadline}}</b><span style="color:#3D3D3A">{{r.checked}}</span>
</div>
</a>
</sc-for>
<span style="align-self:center;font-size:11px;font-weight:700;text-transform:uppercase;border:2px dashed #111111;padding:3px 8px">Data contoh</span>
</div>
<nav style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:3px solid #111111;background:#FFFFFF;flex:none">
<a href="CList.dc.html" style="display:flex;align-items:center;justify-content:center;height:52px;font-size:13px;font-weight:800;text-transform:uppercase;text-decoration:none;background:#111111;color:#F7F7F2">Airdrop</a>
<a href="#" style="display:flex;align-items:center;justify-content:center;height:52px;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:none;border-left:2px solid #111111">Garapan</a>
<a href="#" style="display:flex;align-items:center;justify-content:center;height:52px;font-size:13px;font-weight:700;text-transform:uppercase;text-decoration:none;border-left:2px solid #111111">Update</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'live_now' }; }
  renderVals() {
    const tab = this.state.tab;
    const stamp = (deg, color) => 'width:58px;height:58px;flex:none;border-radius:50%;border:3px solid ' + color + ';color:' + color + ';display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(' + deg + 'deg)';
    const pass = (deg) => ({ stampTop: 'LOLOS', stampBottom: '4/4 CEK', stampStyle: stamp(deg, '#1F7A45') });
    const end = (deg) => ({ stampTop: 'ENDED', stampBottom: 'ARSIP', stampStyle: stamp(deg, '#55554F') });
    const claim = 'align-self:flex-start;font-size:11px;font-weight:700;text-transform:uppercase;background:#111111;color:#F7F7F2;padding:4px 8px';
    const verified = 'align-self:flex-start;font-size:12px;font-weight:700;border:2px solid #1F7A45;color:#1F7A45;padding:3px 7px';
    const reported = 'align-self:flex-start;font-size:12px;font-weight:600;border:2px dashed #111111;padding:3px 7px';
    const plain = 'align-self:flex-start;font-size:12px;font-weight:600;border:2px solid #111111;padding:3px 7px';
    const data = {
      live_now: [
        { ...pass(6), name: 'Orbit Chain', meta: 'L2 · Ethereum', risk: 'Rendah', signal: 'Claim open · link dicek', signalStyle: claim, deadline: 'Claim s.d. 25 Okt', checked: 'Dicek hari ini' },
        { ...pass(-7), name: 'Nebula Perps', meta: 'Perp DEX · Arbitrum', risk: 'Rendah', signal: 'VC: Paradigm ✓', signalStyle: verified, deadline: 'Snapshot 30 Nov', checked: 'Dicek hari ini' },
        { ...pass(3), name: 'Kestrel Lend', meta: 'Lending · Base', risk: 'Sedang', signal: 'Menurut AlphaDrops: a16z (lead)', signalStyle: reported, deadline: 'Belum ada tanggal', checked: 'Dicek kemarin' }
      ],
      early_bets: [
        { ...pass(-5), name: 'Vega Restake', meta: 'Restaking · Ethereum', risk: 'Rendah', signal: 'TVL $210 jt', signalStyle: plain, deadline: 'Belum diumumkan', checked: 'Dicek hari ini' },
        { ...pass(4), name: 'Lumen AI', meta: 'AI Agents · Multichain', risk: 'Rendah', signal: 'Menurut AlphaDrops: Sequoia (lead)', signalStyle: reported, deadline: 'Waitlist', checked: 'Dicek hari ini' }
      ],
      ended: [
        { ...end(-4), name: 'Astra Swap', meta: 'DEX · Base', risk: 'Rendah', signal: 'Listed di CoinGecko', signalStyle: plain, deadline: 'Ended 5 Okt 2026', checked: 'Last check 5 Okt' }
      ]
    };
    const on = 'flex:none;background:#111111;color:#F7F7F2;border:2px solid #111111;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;padding:9px 12px;cursor:pointer';
    const off = 'flex:none;background:#FFFFFF;color:#111111;border:2px solid #111111;font:inherit;font-size:13px;font-weight:700;text-transform:uppercase;padding:9px 12px;cursor:pointer';
    const tabs = [['live_now', 'Live'], ['early_bets', 'Early'], ['ended', 'Ended']].map(([id, label]) => ({
      label, style: id === tab ? on : off, pick: () => this.setState({ tab: id })
    }));
    return { tabs, rows: data[tab] };
  }
}
</script>
</body>
</html>
